name: Publish agent-contracts

# On a v* tag, build + test the @re-cinq/agent-contracts package and publish it to
# npm with provenance, tag the Go module packages/agent-contracts-go at the same
# version, deploy the Java com.re-cinq:agent-contracts jar and the ReCinq.AgentContracts
# NuGet package to GitHub Packages, and publish re-cinq-agent-contracts to PyPI. The Rust
# crate needs no job: consumers depend on it from git at the release tag.
#
# PyPI is tokenless too (Trusted Publishing): it needs a trusted publisher on pypi.org for
# re-cinq-agent-contracts pointing at this repo and publish-contracts.yml (a "pending
# publisher" before the first release). The TS types are regenerated from the D model first and the
# drift check guards that the committed output matches the structs.
#
# Auth is tokenless via npm Trusted Publishing (OIDC): no NPM_TOKEN secret. It needs
# `id-token: write` (below), npm >= 11.5.1 (upgraded below), and a trusted publisher
# configured for @re-cinq/agent-contracts on npmjs.com pointing at this repo and the
# publish-contracts.yml workflow. The package's first-ever publish must be done once
# with a token before the trusted publisher can be registered on npmjs.com.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance via the GitHub OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dlang-community/setup-dlang@d7d85fcde7c4cd5f9a6618fce1bccc316e1e910b # v2
        with:
          compiler: dmd-2.111.0
      - name: Contracts drift check (types match the D model)
        run: ./scripts/check-contracts-drift.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1
      # A tag whose package.json was never bumped republishes an existing version,
      # which npm rejects — and the rejection reads like an auth failure, so it went
      # unnoticed from v0.5.0 to v0.7.0 (#139). Fail here instead, naming the bump.
      - name: Package version matches the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-contracts-version.sh "$TAG"
      - name: Install, test (100% coverage gate), build
        working-directory: packages/agent-contracts
        run: |
          npm ci
          npm run test:coverage
          npm run build
      - name: Publish to npm
        working-directory: packages/agent-contracts
        run: npm publish --provenance --access public

  # Go modules publish through git tags: a module in a subdirectory is versioned by a
  # tag prefixed with its path. Tagging the release commit makes
  # `go get github.com/re-cinq/ai-agent-subsystem/packages/agent-contracts-go@vX.Y.Z` resolve.
  publish-go:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the module tag
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dlang-community/setup-dlang@d7d85fcde7c4cd5f9a6618fce1bccc316e1e910b # v2
        with:
          compiler: dmd-2.111.0
      - name: Contracts drift check (types match the D model)
        run: ./scripts/check-contracts-drift.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/agent-contracts-go/go.mod
          cache-dependency-path: packages/agent-contracts-go/go.sum
      - name: Vet, gofmt and test
        run: make contracts-go
      - name: Tag the Go module
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git tag "packages/agent-contracts-go/$TAG" "$GITHUB_SHA"
          git push origin "packages/agent-contracts-go/$TAG"

  # The Java jar goes to GitHub Packages with the workflow's own GITHUB_TOKEN; setup-java
  # writes the matching settings.xml server entry (id "github", the pom's distributionManagement).
  publish-java:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dlang-community/setup-dlang@d7d85fcde7c4cd5f9a6618fce1bccc316e1e910b # v2
        with:
          compiler: dmd-2.111.0
      - name: Contracts drift check (types match the D model)
        run: ./scripts/check-contracts-drift.sh
      - name: Package version matches the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-contracts-version.sh "$TAG"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
      - name: Test and deploy to GitHub Packages
        working-directory: packages/agent-contracts-java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -q deploy

  publish-python:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dlang-community/setup-dlang@d7d85fcde7c4cd5f9a6618fce1bccc316e1e910b # v2
        with:
          compiler: dmd-2.111.0
      - name: Contracts drift check (types match the D model)
        run: ./scripts/check-contracts-drift.sh
      - name: Package version matches the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-contracts-version.sh "$TAG"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test and build the sdist and wheel
        run: |
          make contracts-python
          cd packages/agent-contracts-python && .venv/bin/pip install -q build && .venv/bin/python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/agent-contracts-python/dist

  publish-dotnet:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dlang-community/setup-dlang@d7d85fcde7c4cd5f9a6618fce1bccc316e1e910b # v2
        with:
          compiler: dmd-2.111.0
      - name: Contracts drift check (types match the D model)
        run: ./scripts/check-contracts-drift.sh
      - name: Package version matches the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-contracts-version.sh "$TAG"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Test, pack and push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make contracts-dotnet
          cd packages/agent-contracts-dotnet
          dotnet pack src/ReCinq.AgentContracts -c Release -o dist
          dotnet nuget push "dist/*.nupkg" --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --api-key "$GITHUB_TOKEN"

name: Lore test report

on:
  push:
  pull_request:

permissions:
  contents: read

# Lore takes a test report from the default branch only, signed in with the run's
# GitHub identity token. Each suite is therefore two jobs: one that runs the tests
# on a pull request or another branch and posts nothing, and one that runs them
# and posts on a push to the default branch. Only the second may mint an identity
# token (id-token: write), so pull request code never runs beside one.
jobs:
  d-tests:
    name: D unit tests (dub)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.ref != format('refs/heads/{0}', github.event.repository.default_branch) &&
      (contains(toJson(github.event.commits), '"packages/') ||
      contains(toJson(github.event.commits), '"dub.json') ||
      contains(toJson(github.event.commits), '"Makefile')))
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up D toolchain (DMD)
        uses: dlang-community/setup-dlang@d7d85fcde7c4cd5f9a6618fce1bccc316e1e910b # v2
        with:
          compiler: dmd-2.111.0

      - name: Fetch lore-code-trace
        env:
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL || vars.LORE_API_URL }}
        run: |
          curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/linux-amd64" -o linux-amd64
          curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          mv linux-amd64 lore-code-trace
          chmod +x lore-code-trace

      - name: Run tests
        run: ./lore-code-trace > /dev/null || echo "::warning::Lore test run failed"

  d-report:
    name: D unit tests (dub), report to Lore
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (contains(toJson(github.event.commits), '"packages/') ||
      contains(toJson(github.event.commits), '"dub.json') ||
      contains(toJson(github.event.commits), '"Makefile'))
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up D toolchain (DMD)
        uses: dlang-community/setup-dlang@d7d85fcde7c4cd5f9a6618fce1bccc316e1e910b # v2
        with:
          compiler: dmd-2.111.0

      - name: Fetch lore-code-trace
        env:
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL || vars.LORE_API_URL }}
        run: |
          curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/linux-amd64" -o linux-amd64
          curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          mv linux-amd64 lore-code-trace
          chmod +x lore-code-trace

      - name: Run tests and post report to Lore
        env:
          LORE_CI_AUTH: identity
          LORE_API_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL || vars.LORE_API_URL }}
        run: ./lore-code-trace --post || echo "::warning::Lore test ingest failed"

  contracts-tests:
    name: "@re-cinq/agent-contracts (vitest)"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    defaults:
      run:
        working-directory: packages/agent-contracts
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Fetch lore-code-trace
        working-directory: .
        env:
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL || vars.LORE_API_URL }}
        run: |
          curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/linux-amd64" -o linux-amd64
          curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          mv linux-amd64 lore-code-trace
          chmod +x lore-code-trace

      - name: Run tests
        working-directory: .
        run: ./lore-code-trace > /dev/null || echo "::warning::Lore test run failed"

  contracts-report:
    name: "@re-cinq/agent-contracts (vitest), report to Lore"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/agent-contracts
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Fetch lore-code-trace
        working-directory: .
        env:
          LORE_INGEST_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL || vars.LORE_API_URL }}
        run: |
          curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/linux-amd64" -o linux-amd64
          curl -fsSL "${LORE_INGEST_URL}/dist/lore-code-trace/checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          mv linux-amd64 lore-code-trace
          chmod +x lore-code-trace

      - name: Run tests and post report to Lore
        working-directory: .
        env:
          LORE_CI_AUTH: identity
          LORE_API_URL: ${{ secrets.LORE_INGEST_URL || vars.LORE_INGEST_URL || vars.LORE_API_URL }}
        run: ./lore-code-trace --post || echo "::warning::Lore test ingest failed"

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'deploy/**'
      - 'dub.json'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only build and test, never write to the repo or
# registry. A read-only token caps what a malicious PR or dependency can do.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dlang-community/setup-dlang@d7d85fcde7c4cd5f9a6618fce1bccc316e1e910b # v2
        with:
          compiler: dmd-2.111.0
      - name: Unit tests
        run: make test
      - name: Build binaries
        run: make build
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0 # renders the chart in the Helm drift check
      - name: PyYAML for the Helm drift check
        run: python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
      - name: Drift checks (generated CRDs + TS contracts + Helm chart)
        run: make drift
      - name: Host integration tests (supervisor + initializer)
        run: make itest

  agent-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-contracts
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Test (100% coverage gate)
        run: npm run test:coverage
      - name: Build
        run: npm run build

  agent-contracts-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/agent-contracts-go/go.mod
          cache-dependency-path: packages/agent-contracts-go/go.sum
      - name: Vet, gofmt and test
        run: make contracts-go

  agent-contracts-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test (100% coverage gate) and package
        run: make contracts-java

  agent-contracts-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Test (100% coverage gate on the client)
        run: make contracts-python

  agent-contracts-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install stable Rust with rustfmt and clippy
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format-check, lint and test
        run: make contracts-rust

  agent-contracts-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and test (100% coverage gate on the client)
        run: make contracts-dotnet

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build with Astro (PR gate for docs)
        uses: withastro/action@b7d53628f8b666036b0238aadb0b984a2a489f26 # v6
        with:
          path: ./website
          node-version: 22

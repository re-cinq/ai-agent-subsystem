name: Publish images

# Build and push the controller and agent runtime images to GHCR. On main this runs
# only after the CI workflow succeeds on the merged commit (workflow_run gate), so a
# red build never produces a signed image; version tags and manual dispatch publish
# directly. The agent image is the AGENT_IMAGE the controller injects as each run
# pod's init container; the controller image backs deploy/controller.yaml.
#
# Multi-arch: each image is built natively for linux/amd64 (ubuntu-latest) and
# linux/arm64 (ubuntu-24.04-arm, free for public repos) — no QEMU, which would
# make the LDC compile ~10x slower and flaky. Each leg pushes an untagged image by
# digest; the `merge` job stitches the legs into one OCI index per image, applies
# the tags, and signs the index. That index digest is the one pinned and verified.
#
# Supply chain: each pushed image is signed with cosign (keyless, via the GitHub
# OIDC token — no stored keys) and carries an SPDX SBOM + SLSA provenance
# attestation per platform. The immutable digest is written to the run summary.
#
# Releases: on a v* tag the `release` job renders deploy/ to a single digest-pinned
# install.yaml and attaches it to the GitHub Release — the published `kubectl apply
# -f` artifact, and pushes the cosign-signed Helm chart packaged from the same
# checkout to oci://ghcr.io/re-cinq/charts. The `pin` job then opens a PR that points deploy/ AND the docs
# cosign-verify example at the same digests (scripts/pin-image-digests.sh), so main
# never ships a floating :latest. See README "Releases".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing via the GitHub OIDC token

jobs:
  build:
    # On main, only publish if the CI workflow that triggered us passed AND it ran
    # on this repo's own main branch — a fork PR's CI also emits a workflow_run
    # whose head_branch is the fork's branch name, so without the head_repository
    # guard a fork that names its branch "main" could get its commit built, pushed
    # to GHCR, and cosign-signed with our OIDC identity. Tag releases and manual
    # dispatch (no workflow_run context) always run.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        image:
          - name: ghcr.io/re-cinq/ai-agent-controller
            file: deploy/Dockerfile.controller
            key: controller
          - name: ghcr.io/re-cinq/ai-agent
            file: scripts/container/Dockerfile.agent
            key: agent
        platform:
          - { os: ubuntu-latest, target: linux/amd64, arch: amd64 }
          - { os: ubuntu-24.04-arm, target: linux/arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # On the workflow_run path, build the exact commit CI validated; otherwise
          # the tag / dispatch ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # docker-container driver — the runner's default `docker` driver can't emit
      # the SBOM/provenance attestations the build step requests below.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image.name }}
      # Untagged, pushed by digest only; the merge job applies the tags to the index.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform.target }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          sbom: true # SPDX SBOM attestation, attached to the image
          provenance: mode=max # SLSA build provenance attestation
      # Hand each leg's digest to the merge job. A matrix can't set distinct
      # job outputs (legs share one map, last writer wins), so go via artifacts.
      - name: Stage the platform digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${DIGEST}" > "${{ matrix.platform.arch }}.digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leg-${{ matrix.image.key }}-${{ matrix.platform.arch }}
          path: ${{ matrix.platform.arch }}.digest
          retention-days: 1

  # Stitch the per-platform images into one tagged OCI index per image and sign
  # it. `imagetools create` carries each leg's SBOM/provenance manifests into the
  # index; `cosign sign --recursive` signs the index AND the per-platform
  # manifests, so verifying a platform-resolved digest also passes.
  merge:
    name: Merge platforms and sign
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ghcr.io/re-cinq/ai-agent-controller
            key: controller
          - image: ghcr.io/re-cinq/ai-agent
            key: agent
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: leg-${{ matrix.key }}-*
          path: legs
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - id: index
        name: Create the multi-arch index
        env:
          IMAGE: ${{ matrix.image }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          tag_args="$(jq -r '.tags[] | "-t \(.)"' <<<"${META_JSON}")"
          first_tag="$(jq -r '.tags[0]' <<<"${META_JSON}")"
          # shellcheck disable=SC2086 # tag_args is a deliberate word list
          docker buildx imagetools create ${tag_args} \
            "${IMAGE}@$(cat legs/amd64.digest)" \
            "${IMAGE}@$(cat legs/arm64.digest)"
          digest="$(docker buildx imagetools inspect "${first_tag}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the index and its platform manifests by digest (keyless)
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
      - name: Record the immutable digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: echo "- \`${IMAGE}@${DIGEST}\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
      # Hand the index digest to the release and pin jobs (artifacts again, same
      # matrix-output limitation as above).
      - name: Stage the digest for the pin job
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: echo "${DIGEST}" > "${{ matrix.key }}.digest"
      - name: Upload the digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.key }}
          path: ${{ matrix.key }}.digest
          retention-days: 1

  # On a v* tag, render the tagged deploy/ to one flat, digest-pinned install.yaml
  # and attach it to the GitHub Release. This is the artifact `kubectl apply -f
  # .../releases/.../install.yaml` fetches. The digests come from the build outputs
  # above (no registry read). The pin script also rewrites the docs cosign example
  # here, but only deploy/ feeds `kubectl kustomize` and this checkout is discarded.
  #
  # The same pinned checkout is packaged as the Helm chart (deploy/helm, ADR-004),
  # pushed to oci://ghcr.io/re-cinq/charts, cosign-signed by its pushed digest like
  # the images, and attached to the release next to install.yaml.
  release:
    name: Render and attach install.yaml and the Helm chart
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the assets
      packages: write # push the chart to ghcr.io/re-cinq/charts
      id-token: write # keyless cosign signing of the chart
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6 # the tagged commit, so install.yaml matches the release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4 # provides `kubectl kustomize`
      - name: Render the digest-pinned install.yaml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export CONTROLLER_DIGEST="$(cat digests/controller.digest)"
          export AGENT_DIGEST="$(cat digests/agent.digest)"
          ./scripts/pin-image-digests.sh "$TAG"
          kubectl kustomize deploy > install.yaml
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: chart
        name: Package and push the Helm chart
        env:
          ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "$ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
          package="$(helm package deploy/helm/ai-agent-subsystem | sed -n 's/^Successfully packaged chart and saved it to: //p')"
          digest="$(helm push "$package" oci://ghcr.io/re-cinq/charts 2>&1 | tee /dev/stderr | sed -n 's/^Digest: //p')"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the chart by digest (keyless)
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/re-cinq/charts/ai-agent-subsystem@${DIGEST}"
          echo "- \`ghcr.io/re-cinq/charts/ai-agent-subsystem@${DIGEST}\` (Helm chart)" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the release and upload install.yaml and the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          CHART: ${{ steps.chart.outputs.package }}
        run: |
          # A hyphen marks a semver pre-release (v0.1.0-rc1); flag it so it never
          # becomes the "latest" release that releases/latest/download/ serves.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease";; esac
          gh release create "$TAG" install.yaml "$CHART" --generate-notes $prerelease \
            || gh release upload "$TAG" install.yaml "$CHART" --clobber

  # On a v* tag, point deploy/ at the exact signed digests this run built and open
  # a PR. The digests come from the build outputs above, so no registry read is
  # needed. Requires the repo setting "Allow GitHub Actions to create and approve
  # pull requests" (Settings -> Actions -> General). The PR is opened with the
  # default token, so it deliberately carries a digest-only change (deploy/ + the
  # docs cosign example) for a human to review and merge.
  pin:
    name: Pin deploy/ and docs to released digests
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the pin branch
      pull-requests: write # open the pin PR
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main # pin onto the development branch, not the tagged commit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Pin deploy/ + docs and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DOCS: website/src/content/docs/setup/install.md
        run: |
          export CONTROLLER_DIGEST="$(cat digests/controller.digest)"
          export AGENT_DIGEST="$(cat digests/agent.digest)"
          ./scripts/pin-image-digests.sh "$TAG"
          if git diff --quiet -- deploy/ "$DOCS"; then
            echo "deploy/ and docs already pinned to ${TAG}; nothing to do"
            exit 0
          fi
          branch="chore/pin-deploy-${TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(release): pin deploy/ and docs to ${TAG} image digests"
          git push -u origin "$branch" --force-with-lease
          gh pr create --base main --head "$branch" \
            --title "chore(release): pin deploy/ and docs to ${TAG} image digests" \
            --body "Automated by the release pin job. deploy/ and the install-page cosign-verify example now reference the cosign-signed digests built for \`${TAG}\` instead of a mutable tag, closing the floating-\`:latest\` gap for this release."

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-controller
  namespace: ai-agents
spec:
  template:
    spec:
      containers:
        - name: controller
          env:
            - name: WEBHOOKS_ENABLED
              value: "true"
            - name: WEBHOOK_PORT
              value: "8083"
          ports:
            - name: webhooks
              containerPort: 8083

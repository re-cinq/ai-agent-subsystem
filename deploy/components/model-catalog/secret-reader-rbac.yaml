apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-controller-model-catalog
  namespace: ai-agents
rules:
  # Only the agent-secrets Secret, only get: the controller reads the vendor API keys
  # AgentDefinitions map from it through resources.secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["agent-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-controller-model-catalog
  namespace: ai-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-controller-model-catalog
subjects:
  - kind: ServiceAccount
    name: agent-controller
    namespace: ai-agents

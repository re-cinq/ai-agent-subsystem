apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentspawners.agents.re-cinq.com
spec:
  group: agents.re-cinq.com
  scope: Namespaced
  names:
    plural: agentspawners
    singular: agentspawner
    kind: AgentSpawner
    shortNames:
      - asp
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Station
          type: string
          jsonPath: .spec.stationRef
        - name: Suspend
          type: boolean
          jsonPath: .spec.suspend
        - name: Last Schedule
          type: date
          jsonPath: .status.lastScheduleTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "Creates an Agent in a Station on a cron schedule."
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - stationRef
                - schedule
              properties:
                stationRef:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                  maxLength: 253
                  description: "The Station each spawned Agent runs in."
                schedule:
                  type: string
                  pattern: "^\\s*\\S+(\\s+\\S+){4}\\s*$"
                  description: "Five-field cron expression (minute hour day-of-month month day-of-week), evaluated in UTC."
                parameters:
                  type: object
                  description: "Copied verbatim into every spawned Agent's spec.parameters."
                  additionalProperties:
                    type: string
                concurrencyPolicy:
                  type: string
                  description: "Allow starts a run on every tick; Forbid skips a tick while an Agent this spawner created is not finished."
                  enum:
                    - "Allow"
                    - "Forbid"
                suspend:
                  type: boolean
                  description: "True stops new runs; runs already started are left alone."
            status:
              type: object
              properties:
                lastScheduleTime:
                  type: string
                  format: date-time
                  description: "RFC3339 schedule time of the last tick handled, whether it created an Agent or was skipped."
                lastAgent:
                  type: string
                  description: "Name of the last Agent this spawner created."

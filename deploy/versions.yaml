# What this install runs, for any reader in the cluster: the subsystem release
# and the agent CLI each vendor's init installs. A read-only contract; values are
# set by scripts/pin-image-digests.sh from the release tag and the D pins
# (packages/agentcore/source/agentcore/vendors/*/setup.d).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-subsystem-versions
  namespace: ai-agents
  labels:
    agents.re-cinq.com/component: versions
data:
  version: "0.19.0"
  claude-cli: "2.1.311"
  codex-cli: "0.167.1"
  gemini-cli: "0.62.0"
  # OpenCode is installed from its official installer, unpinned.
  opencode-cli: "latest"

# Image digests are kept in step with deploy/ by scripts/pin-image-digests.sh.
controller:
  image:
    repository: ghcr.io/re-cinq/ai-agent-controller
    digest: sha256:c9711e9a0bb15fcdaa071bb1ea42e2fe69f8ba4f5b48feb2b6ac923f427970a8
  # A PodMonitor for a cluster that runs the Prometheus operator.
  podMonitor: { enabled: false }

# Injected into each run pod as the init container that provides the agent runtime.
agentImage: ghcr.io/re-cinq/ai-agent@sha256:84210c6d578b2b336eb31117c0f230685ab922c3076fcd13dbed27e054496ac8

# The agent CLI each vendor's init installs, published in the agent-subsystem-versions
# ConfigMap. Set by scripts/pin-image-digests.sh from the D pins; a unit test holds them equal.
cli:
  claude: "2.1.311"
  codex: "0.167.1"
  gemini: "0.62.0"
  opencode: "latest"

# Each toggle reproduces the deploy/components/<name> kustomize component.
batch:
  enabled: false
modelCatalog:
  enabled: false
realtime:
  enabled: false
webhooks:
  enabled: false

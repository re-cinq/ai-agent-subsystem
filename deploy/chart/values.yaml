# Image digests are kept in step with deploy/ by scripts/pin-image-digests.sh.
controller:
  image:
    repository: ghcr.io/re-cinq/ai-agent-controller
    digest: sha256:9f73359c744b1805ee9a2216c423edebd71949005c5ce1225f547cc2553d5ae2
  # A PodMonitor for a cluster that runs the Prometheus operator.
  podMonitor: { enabled: false }

# Injected into each run pod as the init container that provides the agent runtime.
agentImage: ghcr.io/re-cinq/ai-agent@sha256:93c0c69911480377731b43f1fe9b443fcb2a30550b8c00856faaefd7e2f3f70c

# Each toggle reproduces the deploy/components/<name> kustomize component.
batch:
  enabled: false
modelCatalog:
  enabled: false
realtime:
  enabled: false
webhooks:
  enabled: false

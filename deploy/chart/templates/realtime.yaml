{{- if .Values.realtime.enabled }}
# The prompt API. Every controller replica serves it, leader or not.
apiVersion: v1
kind: Service
metadata:
  name: agent-controller-api
  namespace: ai-agents
  labels:
    agents.re-cinq.com/component: controller
spec:
  selector:
    agents.re-cinq.com/component: controller
  ports:
    - name: realtime-api
      port: 8082
      targetPort: realtime-api
---
# Admits the controller to a realtime run pod's supervisor, on its prompt port only.
# Additive to agent-job-egress, which still denies every other ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-job-realtime-ingress
  namespace: ai-agents
spec:
  podSelector:
    matchLabels:
      agents.re-cinq.com/component: job
      agents.re-cinq.com/execution: realtime
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              agents.re-cinq.com/component: controller
      ports:
        - protocol: TCP
          port: 8090
{{- end }}

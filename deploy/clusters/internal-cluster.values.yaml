# re:cinq's internal cluster (project re-cinq-internal). Argo CD deploys the
# chart (deploy/chart; deploy/helm/ai-agent-subsystem links to it) with these
# values on every merge to main (re-cinq/infrastructure, docs/deploying.md).
# Everything lands in the chart's own `ai-agents` namespace; the floor
# (re-cinq/floor) creates its Agents there.
#
# Images pinned to v0.20.0, the digests in that release's install.yaml. They
# replaced v0.18.0; the CRDs have not changed between the two. Move both
# digests together.
controller:
  image:
    repository: ghcr.io/re-cinq/ai-agent-controller
    digest: sha256:b1308d2162702abe4d8434e89b381868579dbfccfffc9f318af09dc3469756d2
  podMonitor: { enabled: true }
agentImage: ghcr.io/re-cinq/ai-agent@sha256:b873e2975e3e38383cb2c0a95758287294d018b65177bfab440495b657da1954

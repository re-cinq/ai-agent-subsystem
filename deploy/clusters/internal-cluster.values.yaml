# re:cinq's internal cluster (project re-cinq-internal). Argo CD deploys the
# chart (deploy/chart; deploy/helm/ai-agent-subsystem links to it) with these
# values on every merge to main (re-cinq/infrastructure, docs/deploying.md).
# Everything lands in the chart's own `ai-agents` namespace; the floor
# (re-cinq/floor) creates its Agents there.
#
# Images pinned to v0.18.0, the digests in that release's install.yaml. They
# replaced v0.15.0; the CRDs the floor's cluster agent writes have not changed
# between the two. Move both digests together.
controller:
  image:
    repository: ghcr.io/re-cinq/ai-agent-controller
    digest: sha256:14a3b9f18c430f390baf124beb9e26bdedec3e8744b471117145c0f373d8dda0
  podMonitor: { enabled: true }
agentImage: ghcr.io/re-cinq/ai-agent@sha256:b153b7e4ad31d710b440df78e977df2619532cd1af14b9eaa0ecdfcd1c651296

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentspawners.agents.re-cinq.com
spec:
  group: agents.re-cinq.com
  scope: Namespaced
  names:
    plural: agentspawners
    singular: agentspawner
    kind: AgentSpawner
    shortNames:
      - asp
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Station
          type: string
          jsonPath: .spec.stationRef
        - name: Suspend
          type: boolean
          jsonPath: .spec.suspend
        - name: Last Schedule
          type: date
          jsonPath: .status.lastScheduleTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "Creates an Agent in a Station on a cron schedule, on GitHub webhook deliveries, or both."
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - stationRef
              x-kubernetes-validations:
                - rule: "has(self.schedule) || has(self.github)"
                  message: "set schedule, github, or both"
              properties:
                stationRef:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                  maxLength: 253
                  description: "The Station each spawned Agent runs in."
                schedule:
                  type: string
                  pattern: "^\\s*\\S+(\\s+\\S+){4}\\s*$"
                  description: "Five-field cron expression (minute hour day-of-month month day-of-week), evaluated in UTC."
                github:
                  type: object
                  description: "Starts a run for each matching GitHub webhook delivery."
                  required:
                    - secretRef
                    - events
                  properties:
                    secretRef:
                      type: string
                      description: "Key in the agent-secrets Secret holding the webhook's HMAC secret."
                    events:
                      type: array
                      description: "Deliveries that start a run, as <X-GitHub-Event>.<action> (issues.labeled); an event without an action by its name alone."
                      items:
                        type: string
                    label:
                      type: string
                      description: "Only issues carrying this label start a run; for issues.labeled, only when it is the label just added."
                    repository:
                      type: string
                      pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
                      description: "Only deliveries from this owner/name repository start a run."
                parameters:
                  type: object
                  description: "Copied verbatim into every spawned Agent's spec.parameters."
                  additionalProperties:
                    type: string
                concurrencyPolicy:
                  type: string
                  description: "Allow starts a run on every tick; Forbid skips a tick while an Agent this spawner created is not finished."
                  enum:
                    - "Allow"
                    - "Forbid"
                suspend:
                  type: boolean
                  description: "True stops new runs; runs already started are left alone."
            status:
              type: object
              properties:
                lastScheduleTime:
                  type: string
                  format: date-time
                  description: "RFC3339 schedule time of the last tick handled, whether it created an Agent or was skipped."
                lastAgent:
                  type: string
                  description: "Name of the last Agent this spawner created."

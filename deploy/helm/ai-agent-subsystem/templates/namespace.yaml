apiVersion: v1
kind: Namespace
metadata:
  name: ai-agents
  labels:
    agents.re-cinq.com/system: "true"
    # Pod Security Admission. `baseline` at admission blocks privileged pods,
    # host namespaces (hostNetwork/hostPID/hostIPC), and hostPath volumes — the
    # escape hatch the Station template's preserve-unknown-fields passthrough
    # would otherwise leave open. `restricted` is only warned/audited because the
    # run init container legitimately runs as root to provision the workspace.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

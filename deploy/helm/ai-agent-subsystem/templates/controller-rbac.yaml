apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-controller
  namespace: ai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-controller
  namespace: ai-agents
rules:
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["agents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["stations", "agentdefinitions"]
    verbs: ["get", "list", "watch"]
  # The ModelCatalog the controller server-side applies (an apply that creates needs create).
  - apiGroups: ["agents.re-cinq.com"]
    resources: ["modelcatalogs", "modelcatalogs/status"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # No Secret access here: batch execution and the model catalog, the features that need
  # the controller to read agent-secrets, are opt-in via the deploy/components/batch and
  # deploy/components/model-catalog kustomize components.
  # Leader election: replicas contend for a single Lease so only one reconciles.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-controller
  namespace: ai-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-controller
subjects:
  - kind: ServiceAccount
    name: agent-controller
    namespace: ai-agents

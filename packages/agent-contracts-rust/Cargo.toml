[package]
name = "agent-contracts"
# release version: bumped in the release PR together with packages/agent-contracts/package.json
version = "0.15.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Types and a kube-rs client for the ai-agent-subsystem CRDs (Agent / Station / AgentDefinition / ModelCatalog / AgentSpawner). Types are generated from the D source so they cannot drift."
repository = "https://github.com/re-cinq/ai-agent-subsystem"
documentation = "https://re-cinq.github.io/ai-agent-subsystem/clients/rust/"
readme = "README.md"
keywords = ["kubernetes", "kube", "crd", "agents"]

[dependencies]
kube = { version = "5", default-features = false, features = ["client", "derive"] }
k8s-openapi = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
k8s-openapi = { version = "0.29", default-features = false, features = ["latest"] }
kube = { version = "5", default-features = false, features = ["client", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
